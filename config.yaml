# Shared settings, data preparation, and experiment presets.
# Small files under configs/ select these presets for existing commands.
# All relative model/data paths resolve from the repository root, not configs/.
# On another machine, edit model.local_path or set REPRO_MODEL_PATH locally.
# Nonempty REPRO_MODEL_PATH in .env / the process environment overrides YAML.
model:
  backend: transformers
  name: Qwen/Qwen3.5-9B
  base_url: http://127.0.0.1:8000/v1
  api_key_env: REPRO_API_KEY
  local_path: /home/admin1/Qwen3.5-9B  # Complete local Transformers model, including weights.
  max_context_tokens: 16384
  max_completion_tokens: 4096
  temperature: 0.6
  top_p: 1.0
  top_k: 50
  seed_policy: optimizer_retry_v1
  timeout_s: 360
  max_retries: 1
  enable_thinking: false

data:
  dataset: searchqa
  split_dir: data/processed/searchqa
  manifest: null  # Dataset presets below bind the appropriate frozen reference.

experiment:
  condition: original
  profile: course
  # Planned experiment seeds: [0, 42, 127]. Override experiment.seed once per batch.
  # Keep preparation seeds and fixed dataset IDs unchanged.
  seed: 42
  output_root: outputs
  allow_test: false
  initial_skill: null

evolution:
  generations: 1
  population_size: 2
  new_candidates_per_round: 2
  train_eval_num: 5
  reflection_failure_k: 2
  selector: original
  operator_schedule: [mutation_other, mutation_graph, crossover_other, crossover_graph]
  operator_max_completion_tokens: 4096
  graph_retry_attempts: 2
  max_operator_attempts: 6

budget:
  max_calls: 200
  max_completion_tokens: 200000
  gpu_hours_reference: 40

# Dataset preparation never downloads model weights.
preparation:
  raw_cache_dir: data/raw  # Downloaded benchmark data/cache, not experiment-ready splits.
  searchqa_manifest_dir: third_party/GraphSkillEvo/data/searchqa_id_split  # Pinned upstream IDs.
  searchqa_revision: c1a979068ba118d85467179b704031d113d689cc
  hotpotqa_revision: 1908d6afbbead072334abe2965f91bd2709910ab
  searchqa_download_mode: parquet
  hotpotqa_download_mode: parquet
  hotpotqa_source: official-public
  # Optional LOCAL raw inputs. Keep null when reusing A's prepared data.
  searchqa_raw_path: null
  hotpotqa_raw_train: null
  hotpotqa_raw_val: null
  hotpotqa_raw_test: null
  # User-selected stratified protocol; held-out test count is 1000.
  hotpotqa_train_per_level: 100
  hotpotqa_val_per_level: 50
  hotpotqa_test_count: 1000
  hotpotqa_protocol_file: hotpot_split.md
  hotpotqa_ids_output: manifests/hotpotqa-stratified-v2/ids.json
  seed: 42
  train_count: 100
  val_count: 30
  test_count: 50
  pilot_seed: 42
  pilot_train_count: 10
  pilot_val_count: 5  # Pilot data never includes the held-out test partition.

# Dataset locations live here; configs/*.yaml only select presets.
# Copy complete split directories (including split_manifest.json) from A.
# If relocating data, edit the corresponding split_dir, keeping the SAME data
# and frozen manifest below. Do not resample or disable a manifest to fix paths.
# Presets are composed in the order listed by each file in configs/.
presets:
  course:
    evolution:
      generations: 3
      train_eval_num: 15
      reflection_failure_k: 3
    budget:
      max_calls: 600
      max_completion_tokens: 2000000
  offline:
    experiment:
      profile: synthetic
      output_root: outputs/offline
    evolution:
      train_eval_num: 3
      reflection_failure_k: 1
    budget:
      max_calls: 100
      max_completion_tokens: 100000
  searchqa.course:
    data:
      dataset: searchqa
      split_dir: data/processed/searchqa
      manifest: manifests/data-v1/searchqa.json
  hotpotqa.course:
    # Historical 100/30/50 parent for the engineering pilot, not the current protocol.
    data:
      dataset: hotpotqa
      split_dir: data/processed/hotpotqa
      manifest: manifests/data-v1/hotpotqa.json
  hotpotqa.provisional:
    # Current hotpot_split.md protocol: 300/150/1000; name retained for compatibility.
    data:
      dataset: hotpotqa
      split_dir: data/processed/hotpotqa-stratified-v2
      manifest: manifests/hotpotqa-stratified-v2/hotpotqa.json
    experiment:
      profile: custom
    budget:
      # Five times the old ceiling because validation grows from 30 to 150.
      max_calls: 3000
      max_completion_tokens: 10000000
  searchqa.pilot:
    # Real 10/5/0 engineering checks; make_pilot_data.py reads *.course parents.
    data:
      dataset: searchqa
      split_dir: data/pilot/searchqa
      manifest: null
  hotpotqa.pilot:
    data:
      dataset: hotpotqa
      split_dir: data/pilot/hotpotqa
      manifest: null
  searchqa.offline:
    data:
      dataset: searchqa
      split_dir: tests/fixtures/searchqa
      manifest: null
  hotpotqa.offline:
    data:
      dataset: hotpotqa
      split_dir: tests/fixtures/hotpotqa
      manifest: null
  local.gguf:
    # DEPRECATED: historical Qwen3.8-27B GGUF backend, retained for old artifacts only.
    # New setup and experiments use model.backend=transformers / Qwen3.5-9B above.
    model:
      backend: llama_cpp
      name: Qwen3.8-27B-Q4_K_M
      local_path: E:/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
      max_context_tokens: 8192
      max_completion_tokens: 2048
      temperature: 0.0
      timeout_s: 180
      seed_policy: fixed
