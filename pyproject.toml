[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphskill-repro"
version = "0.1.0"
description = "Reproducible GraphSkillEvo experiments for SearchQA and HotpotQA"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=1.70,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
data = ["datasets>=3,<5", "huggingface-hub>=0.30,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
server = [
  "transformers>=5.2,<6",
  "accelerate>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
repro = "repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["third_party", ".venv", ".venv-linux", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
